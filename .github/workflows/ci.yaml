name: Moodle Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [MOODLE_405_STABLE, MOODLE_503_STABLE]
        php: ['8.3']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: >-
            max_input_vars=5000,
            opcache.enable_cli=0,
            opcache.jit=0,
            opcache.jit_buffer_size=0
          coverage: pcov

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Check out integration plugins
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: |
          mkdir -p extra-plugins
          git clone --depth 1 --branch "$MOODLE_BRANCH" \
            https://github.com/danmarsden/moodle-mod_attendance.git extra-plugins/attendance
          if [ "$MOODLE_BRANCH" = "MOODLE_405_STABLE" ]; then
            kuetbranch="MOODLE_405_STABLE"
          else
            kuetbranch="feature/Moodle502"
          fi
          git clone --depth 1 --branch "$kuetbranch" \
            https://github.com/UNIMOODLE/moodle-mod_kuet.git extra-plugins/kuet
          git clone --depth 1 --branch dev \
            https://github.com/juacas/moodle-mod_quest.git extra-plugins/quest

      - name: Install Moodle
        run: >-
          moodle-plugin-ci install --plugin ./plugin --extra-plugins ./extra-plugins
          --db-host=127.0.0.1 --no-plugin-node
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP syntax
        run: moodle-plugin-ci phplint ./plugin

      - name: Moodle Code Checker
        run: moodle-plugin-ci phpcs --max-warnings 0 ./plugin

      - name: Validate plugin
        run: moodle-plugin-ci validate --moodle ./moodle ./plugin

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints ./plugin

      - name: PHPUnit with coverage
        run: >-
          moodle-plugin-ci phpunit --fail-on-warning --coverage-clover --coverage-pcov

      - name: Behat acceptance tests
        run: moodle-plugin-ci behat --profile chrome --start-servers ./plugin

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.moodle-branch }}-php${{ matrix.php }}
          path: coverage.xml
          if-no-files-found: ignore
